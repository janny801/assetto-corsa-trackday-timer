[ABOUT]
NAME = Trackday Timer
AUTHOR = janny801
VERSION = 1.0
DESCRIPTION = Choose a Track Day duration, then return to pits and open session results when it expires.
REQUIRED_VERSION = 2498

[CORE]
LAZY = FULL

[WINDOW_...]
ID = main
NAME = Track Day Timer
FUNCTION_MAIN = windowMain
FLAGS = FIXED_SIZE
